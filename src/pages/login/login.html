<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-input label="Email" type="email" labelPlacement="floating" [(ngModel)]="email"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input label="Password" type="password" labelPlacement="floating" [(ngModel)]="password"></ion-input>
  </ion-item>
  <ion-button expand="block" class="ion-margin-top" (click)="login()">
    Login
  </ion-button>
</ion-content>
