<ion-content class="auth-bg">

  <div class="auth-wrapper">

    <ion-img src="assets/logo/qwik2pay.png" class="app-logo"></ion-img>

    <div class="auth-card">

      <h2 class="auth-title">Login</h2>

      <form [formGroup]="form" (ngSubmit)="login()">

        <div class="input-group">
          <label>Email</label>
          <ion-input type="email" formControlName="email" placeholder="Type your email">
          </ion-input>
        </div>

        <div class="input-group">
          <label>Password</label>
          <ion-input type="password" formControlName="password" placeholder="Type your password">
          </ion-input>
        </div>

        <ion-button expand="block" shape="round" type="submit" class="primary-btn">
          LOGIN
        </ion-button>

      </form>

      <div class="auth-footer">
        Don’t have an account?
        <span routerLink="/signup">SIGN UP</span>
      </div>

    </div>

  </div>

</ion-content>
