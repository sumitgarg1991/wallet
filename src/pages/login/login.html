<ion-content class="auth-bg">
  <div class="auth-wrapper">


    <div class="auth-card">
      <ion-img src="assets/logo/qwik2pay.png" class="app-logo"></ion-img>
      <h2 class="auth-title">Login</h2>

      <form [formGroup]="form" (ngSubmit)="login()">
        <div class="input-group">
          <label>Email</label>
          <ion-input type="email" formControlName="email" placeholder="Type your email" autocomplete="email"
            inputmode="email">
          </ion-input>
        </div>

        <div class="input-group">
          <label>Password</label>
          <ion-input type="password" formControlName="password" placeholder="Type your password"
            autocomplete="current-password">
          </ion-input>
          <div class="inline-actions">
            <a (click)="forgotPassword()" class="link">Forgot password?</a>
          </div>
        </div>

        <ion-button expand="block" shape="round" type="submit" class="primary-btn"
          [disabled]="form.invalid || isSubmitting">
          LOGIN
        </ion-button>
      </form>

      <div class="divider">
        <span>Or Sign In Using</span>
      </div>

      <div class="social-login">
        <ion-button fill="clear" class="social-btn google" (click)="loginWithGoogle()">
          <ion-icon name="logo-google"></ion-icon>
        </ion-button>
        <ion-button fill="clear" class="social-btn facebook" (click)="loginWithFacebook()">
          <ion-icon name="logo-facebook"></ion-icon>
        </ion-button>
        <!-- <ion-button fill="clear" class="social-btn twitter" (click)="loginWithTwitter()">
          <ion-icon name="logo-twitter"></ion-icon>
        </ion-button> -->
      </div>

      <div class="auth-footer">
        Don’t have an account?
        <span routerLink="/signup">SIGN UP</span>
      </div>
    </div>
  </div>
</ion-content>
