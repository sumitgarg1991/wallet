<ion-content class="ion-padding">
    <ion-img src="assets/logo/qwik2pay-logo.png" class="app-logo"></ion-img>
    <form [formGroup]="form" (ngSubmit)="register()">
        <ion-item>
            <ion-input label="Email" type="email" formControlName="email"></ion-input>
        </ion-item>
        <ion-item>
            <ion-input label="Mobile Number" type="tel" formControlName="mobile"></ion-input>
        </ion-item>
        <ion-item>
            <ion-input label="Password" type="password" formControlName="password"></ion-input>
        </ion-item>
        <ion-button expand="block" (click)="sendOtp()" [disabled]="otpSent">
            Send Verification Code
        </ion-button>
        <ion-item *ngIf="otpSent">
            <ion-input label="OTP" formControlName="otp"></ion-input>
        </ion-item>
        <ion-button expand="block" type="submit" [disabled]="!otpVerified">
            Create Account
        </ion-button>
    </form>
</ion-content>
